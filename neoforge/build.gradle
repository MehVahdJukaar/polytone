plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"

}

architectury {
    platformSetupLoomIde()
    neoForge {
        //platformPackage = "forge"
    }
}


loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}


processResources {
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta', 'update.json']) {
        expand rootProject.ext.replaceProperties + [project: project]
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = "neoforge"
    atAccessWideners.add("${mod_id}.accesswidener") // this is a path inside the mod jar
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }

    archiveClassifier = "neoforge-sources"
}

remapSourcesJar{
    archiveClassifier = "neoforge-sources"
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.mod_id + "-" + project.name
            from components.java
        }
    }
}



// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


tasks.withType(JavaCompile).configureEach {
    it.options.compilerArgs.add("-Acrafttweaker.processor.document.output_directory=${new File(rootProject.buildDir, "docsOut")}")
    it.options.compilerArgs.add("-Acrafttweaker.processor.document.multi_source=true")

    it.options.compilerArgs << "-Xmaxerrs" << "4000"

}

dependencies {
    //forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    neoForge "net.neoforged:neoforge:${neo_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }


    implementation "org.ow2.asm:asm:9.5"
    implementation "org.ow2.asm:asm-commons:9.5"

    implementation include( "net.objecthunter:exp4j:${exp4j_version}")
    forgeRuntimeLibrary ( "net.objecthunter:exp4j:${exp4j_version}")
    implementation include("org.mvel:mvel2:${mvel_version}")
    forgeRuntimeLibrary ("org.mvel:mvel2:${mvel_version}")

 //   modImplementation ("curse.maven:embeddium-908741:6118392")
    modCompileOnly ("curse.maven:curios-309927:6538253")
   // modCompileOnly ("curse.maven:embeddium-908741:6116910")

   // modCompileOnly("curse.maven:alexs-caves-924854:4806837")
   // modCompileOnly("curse.maven:citadel-331936:4786380")
    //modCompileOnly ("org.embeddedt:embeddium-1.21:1.0.7+mc1.21")
   // modCompileOnly("curse.maven:farmers-delight-398521:5772720")
    //
    modCompileOnly "curse.maven:serene-seasons-291874:6182596"

    implementation 'org.jetbrains:annotations:22.0.0'
}
