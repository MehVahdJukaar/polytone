
modLoader = "javafml"

license = "${mod_license}"
issueTrackerURL = "${mod_github}/issues"

[[mixins]]
    config = "${mod_id}.mixins.json"
[[mixins]]
    config = "${mod_id}-common.mixins.json"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    logoFile = "icon.png"
    authors = "${mod_authors}"
    credits = "${mod_credits}"
    description = '''${mod_description}'''
    modUrl = "${mod_homepage}"
    itemIcon="minecraft:brush" #catalogue icon

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "[26.1,26.1.2]"
    ordering = "NONE"
    side = "CLIENT"

# Sodium 0.9 rewrote the internals the shadow-map terrain replay drives (ShaderChunkRenderer.begin's
# signature, RenderSectionManager's cull API, the once-per-frame terrain uniform buffer), so anything
# older mixes crashes and terrain drawn from the light's POV.
[[dependencies.${mod_id}]]
    modId = "sodium"
    type = "incompatible"
    versionRange = "[0,0.9)"
    ordering = "NONE"
    side = "CLIENT"

# Recommended companion: the standalone in-game pack/codec editor UI. Optional — Polytone
# works without it, but installing it unlocks the visual editor for Polytone's content.
[[dependencies.${mod_id}]]
    modId = "nautilus_studio"
    type = "optional"
    versionRange = "[${nautilus_studio_version},)"
    ordering = "NONE"
    side = "CLIENT"


